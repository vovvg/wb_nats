services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: "wb_nats"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgrespw"
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats-streaming-wb:
    image: nats-streaming:latest
    container_name: nats-streaming
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    command: >
      -p 4222
      -m 8222
      --cluster_id nats_wb
      --store file
      --dir /data/a
      --cluster_node_id wb
    volumes:
      - ./data/a:/data/a